      THESIS: A to-do list is a typed sheet you cross lines off of; refuses the

      Prime for desk labels; olive desk by day, lamp pool on dark wood by night;
      ribbon-red strike and error ink; pencil-drawn affordances; no checkboxes.
      STORY: Open your sheet, type lines, press / for blocks, cross finished
      tasks off with a drawn red stroke; it reads as a page, not a program.
      FIRST VIEWPORT: Desk fills the screen; the selected list is one centered
      sheet (~42rem) with its typed title; sheet stack sidebar left; typed session
      strip on top; lamp toggle top right.
      FORM: brief-pinned world (paper + typewriter); pin beats the roll, no seed.
